title: "Spark AI: From Simple Prompts to Smart Actions"
pitch: "An AI productivity assistant that routes every request to the right tool using Strands Decider 2B — so arithmetic is exact, summaries are focused, and every decision is transparent."
features:
  - "smart tool routing with Strands Decider 2B before every LLM call"
  - "exact calculator (safe AST evaluator, never guesses)"
  - "summarizer, rewriter, study planner, code explainer"
  - "live decision panel showing tool selected and confidence"
  - "deployed on Amazon Bedrock AgentCore Runtime"
eager: false
intro: "Spark AI runs on Amazon Bedrock and uses Strands Decider 2B to pick the right tool before every response. Watch the decision panel on the right — it shows which tool was selected and how confident the Decider was."
intro_normal: "Spark AI runs on Amazon Bedrock AgentCore Runtime. Strands Decider 2B picks the right tool before every LLM call. The decision panel shows the tool, confidence, and latency."
turns:
  - say: "What is 847 multiplied by 23?"
    narrate: "A calculation request — the Decider should route this to the calculator tool."
  - say: "Summarize this in bullet points: Artificial intelligence is transforming industries from healthcare to finance. Machine learning models can diagnose diseases, predict markets, and automate workflows that once required teams of specialists."
    narrate: "A summarization request — the Decider routes to the summarizer."
  - say: "Rewrite this more professionally: hey can u help me fix this bug its been driving me crazy lol"
    narrate: "A rewriting request — the Decider picks the rewriter tool."
  - say: "Create a study plan for Math and Physics, 5 days, 2 hours per day"
    narrate: "A study planning request — the Decider routes to the planner."
  - say: "Explain this Python code: def factorial(n): return 1 if n <= 1 else n * factorial(n-1)"
    narrate: "A code explanation request — the Decider selects the code explainer."
  - say: "What is machine learning?"
    narrate: "A general knowledge question — the Decider returns 'none' and the agent answers directly."
outro: "One Decider call per turn, calibrated confidence the code can branch on, and Amazon Bedrock for the conversation. Tool routing that is fast, cheap, and transparent."
